# Local development backing services. Start with `pnpm infra:up`.
# Credentials here are dev-only defaults and match the root .env.example.
name: mail-service-dev

services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: mail
      POSTGRES_PASSWORD: mail
      POSTGRES_DB: mail_service
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U mail -d mail_service"]
      interval: 2s
      timeout: 3s
      retries: 30

  redis:
    image: redis:7-alpine
    # BullMQ requires noeviction so queued jobs are never dropped under memory pressure.
    command: ["redis-server", "--maxmemory-policy", "noeviction"]
    ports:
      - "127.0.0.1:6379:6379"
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 2s
      timeout: 3s
      retries: 30

  # S3-compatible object storage for raw messages and attachments (MinIO's images are no
  # longer published). The worker creates the bucket on start.
  rustfs:
    image: rustfs/rustfs:1.0.4
    environment:
      RUSTFS_ACCESS_KEY: mailservice
      RUSTFS_SECRET_KEY: mailservice-dev-secret
    ports:
      - "127.0.0.1:9000:9000"
    volumes:
      - rustfs-data:/data
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:9000/health"]
      interval: 2s
      timeout: 3s
      retries: 30

volumes:
  postgres-data:
  redis-data:
  rustfs-data:
